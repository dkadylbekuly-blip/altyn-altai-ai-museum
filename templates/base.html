{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Altyn Altai Museum" %}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #1f4b7f;
            color: white;
            padding: 16px 24px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .site-title {
            font-size: 24px;
            font-weight: bold;
        }

        .lang-switcher {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-switcher select,
        .lang-switcher button {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
        }

        .lang-switcher button {
            cursor: pointer;
            background: white;
            color: #1f4b7f;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            color: #666;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<header>
    <div class="topbar">
        <div class="site-title">{% trans "Altyn Altai Museum" %}</div>

        <form action="{% url 'set_language' %}" method="post" class="lang-switcher">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.get_full_path }}">

            <label for="language">{% trans "Language" %}</label>

            <select name="language" id="language">
                {% get_current_language as CURRENT_LANGUAGE %}
                {% get_available_languages as LANGUAGES %}
                {% for code, name in LANGUAGES %}
                    <option value="{{ code }}" {% if code == CURRENT_LANGUAGE %}selected{% endif %}>
                        {{ name }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">{% trans "Change" %}</button>
        </form>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    {% trans "Mineral recognition system for museum exhibits" %}
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{{ mineral.name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">

<div class="max-w-5xl mx-auto py-12 px-6">

  <div class="bg-white rounded-3xl p-10 shadow-sm">

    <h1 class="text-5xl font-black mb-6">
      🪨 {{ mineral.name }}
    </h1>

    {% if mineral.image %}
      <img
        src="{{ mineral.image.url }}"
        class="w-full max-h-[500px] object-cover rounded-3xl mb-8"
      >
    {% endif %}

    <div class="grid md:grid-cols-2 gap-6">

      <div class="bg-slate-50 rounded-2xl p-5">
        <div class="text-sm text-slate-400 font-bold">
          Формула
        </div>

        <div class="mt-2 text-xl font-black">
          {{ mineral.formula|default:"—" }}
        </div>
      </div>

      <div class="bg-slate-50 rounded-2xl p-5">
        <div class="text-sm text-slate-400 font-bold">
          Твёрдость
        </div>

        <div class="mt-2 text-xl font-black">
          {{ mineral.hardness|default:"—" }}
        </div>
      </div>

    </div>

    <div class="mt-8">
      <div class="text-2xl font-black mb-4">
        Описание
      </div>

      <div class="text-slate-600 leading-8 text-lg">
        {{ mineral.description|default:"Описание отсутствует." }}
      </div>
    </div>

  </div>

</div>

</body>
</html>
